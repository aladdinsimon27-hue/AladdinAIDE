apply plugin: 'com.android.application'

android {
    namespace 'com.aladdin.ide'
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.aladdin.ide"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 2
        versionName "2.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
